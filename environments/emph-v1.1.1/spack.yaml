# EMPHATIC release environment for the fnal-v1.1.1 base on
# /cvmfs/emphatic.opensciencegrid.org/spack/v1.1.1. Same shape as
# novaexperiment/nova-release-configs nova-release.yaml. Everything is reused from
# the scisoft binary caches or built, except py-torch and its CUDA (+ml), which come
# from LArSoft's install tree, an upstream listed in upstreams.txt.
spack:
  include:
  - git: https://github.com/art-framework-suite/art-release-configs
    tag: art-3.14.04
    paths:
    - included_yaml/gcc-12-toolchain.yaml
    - included_yaml/packages-art.yaml
    - included_yaml/specs-art.yaml
  - git: https://github.com/fnal-fife/fife-release-configs
    branch: main
    paths:
    - included_yaml/fife_packages.yaml
  specs:
  - $specs_art
  - emphaticsoft@spack-dev ~daq +beamdb +align +ml
  - artdaq-core@v3_10_02 ~bundle cxxstd=17
  view: false
  concretizer:
    unify: true
  packages:
    all:
      variants:
      - generator=ninja
      - build_type=Release
      - cxxstd=17
      target:
      - x86_64_v3
    # +ml: the py-torch build installed in /cvmfs/larsoft.opensciencegrid.org/spack-fnal-v1.1.1
    # (and in the scisoft cache), so it and its CUDA come from LArSoft's install tree, an
    # upstream of the EMPHATIC instance, instead of being copied to our repository.
    py-torch:
      require: "@2.10.0 +cuda cuda_arch=80 ~mkldnn"
