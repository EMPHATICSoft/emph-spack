# EMPHATIC Testing Environment
# Location: emph-spack/environments/testing/spack.yaml
#
# Usage:
#   cd emph-spack/environments/testing
#   spack env activate .
#   spack install

spack:
  # Include shared EMPHATIC configuration
  include:
  - path: ../../configs/emph-release.yaml

  # Environment-specific specs (override/extend the shared config)
  specs:
  - emphaticsoft@spack-dev cxxstd=17 build_type=Debug
  #- $specs_larsoft
  #- $specs_nusofthep
  #- $specs_art
  #- $fife_specs
  #- artdaq
  
  packages:
    all:
      require: '%gcc@12'
    emphaticsoft:
      variants: build_type=Debug  # Override for testing

  # Inherit concretizer settings from emph-release.yaml
  # (No need to override here)

  view: false
